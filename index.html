<body>
    <header>Welcome to the Upchurzzle v3!</header>

    <div>
        <label>Options: (NOT COMPLETED): </label>
        <input type="checkbox" id="arrows" name="arrows" value="arrows" checked>
        <label for="arrows">Up/Down Arrows</label>
        <input type="checkbox" id="length" name="length" value="length" checked>
        <label for="length">Display Lengths</label>
        <input type="checkbox" id="colors" name="colors" value="colors" checked>

            <input id="songInput" placeholder="Guess Here!" autocomplete="off">
            <div id="suggestions" class="suggestions" hidden></div>

        <button id="change_answer">Change the Answer!</button>
        <button id="seeanswer">See the Answer!</button>
