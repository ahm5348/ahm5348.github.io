<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Upchurzzle v3</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <header>Welcome to the Upchurzzle v3!</header>

    <div>
        <label>Options: </label>
        <input type="checkbox" id="arrows" name="arrows" value="arrows" checked>
        <label for="arrows">Up/Down Arrows</label>
        <input type="checkbox" id="length" name="length" value="length" checked>
        <label for="length">Display Lengths</label>
        <input type="checkbox" id="colors" name="colors" value="colors" checked>
        <label for="colors">Display Colors</label>
        <input type="checkbox" id="features" name="features" value="features" checked>
        <label for="features">Display Features</label>
    </div>

    <div>
        <p></p>
    </div>

    <div class="controls">
        <div class="autocomplete">
            <input id="songInput" placeholder="Guess Here!" autocomplete="off">
            <div id="suggestions" class="suggestions" hidden></div>
        </div>

        <button id="change_answer">Change the Answer!</button>
        <button id="seeanswer">See the Answer!</button>

        <div id="answer" class="answer" hidden>
            <div id="answer_text"></div>
        </div>

        <button id="submit" class='primary'>Submit</button>


    </div>

    <div><p></p></div>

    <div id='guessHeader' class="guessRow" hidden>
<!--        <div class="field">-->
<!--            <span class="label">Album: Song:</span>-->
<!--        </div>-->
        <div class="field">
            <span class="label">Album:</span>
        </div>
        <div class="field">
            <span class="label">Song:</span>
        </div>
        <div class="field">
            <span class="label">Album Number:</span>
        </div>
        <div class="field">
            <span class="label">Song Number:</span>
        </div>
        <div class="field">
            <span class="label">Track Length:</span>
        </div>
        <div class="field">
            <span class="label">Features:</span>
        </div>

    </div>
    <div id="guesses" class="guesses"></div>




    <script src="index.js"></script>

</body>
</html>
